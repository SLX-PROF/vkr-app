{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="mx-auto" style="max-width: 380px">
  <h1 class="h3 mb-3">Вход в систему</h1>
  <form method="post" class="card card-body">
    {% csrf_token %}
    {% if form.errors %}<div class="alert alert-danger">Неверное имя пользователя или пароль.</div>{% endif %}
    <div class="mb-3">
      <label class="form-label" for="id_username">Имя пользователя</label>
      <input class="form-control" id="id_username" name="username" autofocus required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="id_password">Пароль</label>
      <input class="form-control" id="id_password" name="password" type="password" required>
    </div>
    <button class="btn btn-primary" type="submit">Войти</button>
  </form>
</div>
{% endblock %}
